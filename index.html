<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fellowship Data</title>
</head>
<body>
  <h1>Fellowship Participants</h1>
  <pre id="output">Loading...</pre>

  <script>
    fetch('data.txt')
      .then(response => response.text())
      .then(text => {
        document.getElementById('output').textContent = text;
      })
      .catch(error => {
        document.getElementById('output').textContent = 'Error loading data.';
        console.error(error);
      });
  </script>
</body>
